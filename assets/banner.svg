<text x="60" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="64" font-weight="700" fill="url(#textGrad)" textLength="1060" lengthAdjust="spacingAndGlyphs">
<tspan x="60" dy="0">League Of Legends</tspan>
</text>
<text x="60" y="222" font-family="'Segoe UI', Arial, sans-serif" font-size="64" font-weight="700" fill="url(#textGrad)" textLength="460" lengthAdjust="spacingAndGlyphs">
