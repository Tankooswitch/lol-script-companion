<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#0a0e1a"/>
<stop offset="50%" stop-color="#0d1425"/>
<stop offset="100%" stop-color="#141b2e"/>
</linearGradient>
<radialGradient id="glow1" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#4fd8e0" stop-opacity="0.5"/>
<stop offset="100%" stop-color="#4fd8e0" stop-opacity="0"/>
</radialGradient>
<radialGradient id="glow2" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#c8952e" stop-opacity="0.4"/>
<stop offset="100%" stop-color="#c8952e" stop-opacity="0"/>
</radialGradient>
<linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#7fe8ef"/>
